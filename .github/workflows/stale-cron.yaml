name: Close inactive issues or PRs
on:
  schedule:
    - cron: "0 0 * * *" # Runs every midnight
  pull_request:
    paths:
      - .github/workflows/stale-cron.yaml

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@b5d41d4e1d5dceea10e7104786b73624c18a190f # v10
        with:
          days-before-stale: 330
          days-before-close: -1 # never auto-close; only label as inactive
          stale-issue-label: inactive
          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            not had recent activity. Thank you for your contributions.
          exempt-pr-labels: pinned,security
          exempt-issue-labels: pinned,security
          repo-token: ${{ secrets.GITHUB_TOKEN }}
