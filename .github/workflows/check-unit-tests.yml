name: Unit Tests

on:
  - pull_request

jobs:
  check-unit-tests:
    name: Check Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - name: Install dependencies in venv
        run: |
          set -eux
          venv="$RUNNER_TEMP/microk8s-unit-test-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install \
            -r tests/requirements.txt \
            tox \
            pytest==7.1.3 \
            sh==1.14.3
          echo "MICROK8S_UNIT_TEST_VENV=$venv" >> "$GITHUB_ENV"

      - name: Check Units
        run: |
          "$MICROK8S_UNIT_TEST_VENV/bin/tox" -e scripts
          "$MICROK8S_UNIT_TEST_VENV/bin/tox" -e wrappers
          "$MICROK8S_UNIT_TEST_VENV/bin/tox" -e cluster

      - name: Verify branches
        run: |
          "$MICROK8S_UNIT_TEST_VENV/bin/pytest" -s ./tests/verify-branches.py
